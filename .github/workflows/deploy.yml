name: Quality Gate & Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    name: Audit & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ARH UI/UX Quality Gate
        run: node _qa/beelal-ui-ux-quality-gate.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
