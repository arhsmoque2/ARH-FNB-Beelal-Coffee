name: Live Deployment Health Check
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target deployment URL to probe"
        required: false
        default: "https://store-beelal-fnb-pwa.arh-homelab.workers.dev"

  workflow_call:
    inputs:
      target_url:
        description: "Target deployment URL to probe"
        required: false
        type: string
        default: "https://store-beelal-fnb-pwa.arh-homelab.workers.dev"

jobs:
  healthcheck:
    name: Live Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Live Deployment Health Check
        run: node _qa/beelal-live-healthcheck.mjs "https://store-beelal-fnb-pwa.arh-homelab.workers.dev"
